# Sample logscope-web server settings (copy and customize).
# Usage: logscope-web --config samples/web.properties

web.bind_host=127.0.0.1
web.bind_port=8080

# Optional API key (also LOGSCOPE_WEB_API_KEY)
# web.api_key=change-me

# CORS origins (comma-separated). When omitted, derived from bind host/port and TLS mode.
# web.cors_origins=http://127.0.0.1:8080,http://localhost:8080

# TLS (requires OpenSSL-enabled build; also LOGSCOPE_WEB_TLS_CERT / LOGSCOPE_WEB_TLS_KEY)
# web.tls_cert=/path/to/cert.pem
# web.tls_key=/path/to/key.pem

web.max_upload_bytes=268435456
web.allow_server_paths=false
web.request_timeout_seconds=300

# M15.3 shared workspaces (v2.2.0)
# web.workspace_dir=workspaces
# web.workspaces_list_limit=100
# web.async_analyze_threshold_bytes=10485760
# web.job_ttl_seconds=3600
# web.job_max_concurrent_per_session=1

# M15.4 thin auth (v2.2.1)
# web.session_ttl_seconds=0
# web.max_sessions=0
# web.health_requires_api_key=false
