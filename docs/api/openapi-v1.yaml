openapi: 3.0.3
info:
  title: LogScope Web API
  version: 2.3.0
  description: |
    REST API for `logscope-web` (ADR-009). Session header `X-LogScope-Session` required
    on most routes. Error envelope `{ "error": { "code", "message" } }`; success `{ "data": ... }`.
    v2.2.1: optional `web.health_requires_api_key`; stale sessions return 401 SESSION_EXPIRED.
    v2.3.0: `/api/v1/investigations` (Story 1); `/api/v1/workspaces` remains alias (M15.3 compat).
    v2.4.0: multi-artifact open (`artifactId`), `pstack`/`core` types, session active artifact (Story 2).
    v2.5.0: investigation timeline projection `GET .../investigations/{id}/timeline` (Story 3).
    v2.6.0: per-artifact crash analysis `GET .../artifacts/{artifactId}/crash-analysis` (Story 4).
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback bind
tags:
  - name: health
  - name: sessions
  - name: sources
  - name: analysis
  - name: investigations
  - name: workspaces
  - name: tail
  - name: jobs
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health and version
      description: |
        Open by default when `web.api_key` is set. Requires `X-LogScope-Api-Key` when
        `web.health_requires_api_key=true` (v2.2.1).
      responses:
        '200':
          description: OK
  /api/v1/sessions/workspace:
    post:
      tags: [sessions]
      summary: Create workspace session
      responses:
        '200':
          description: Session created (X-LogScope-Session header)
  /api/v1/sessions/save:
    post:
      tags: [sessions]
      summary: Save session snapshot
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                  description: Optional shared workspace id (M15.3 alias)
                investigationId:
                  type: string
                  description: Investigation id (v2.3.0 Story 1; preferred over workspaceId)
      responses:
        '200':
          description: Saved
  /api/v1/sources/open:
    post:
      tags: [sources]
      summary: Open log source
      responses:
        '200':
          description: Source opened
  /api/v1/analyze:
    post:
      tags: [analysis]
      summary: Analyze opened source (sync or async)
      description: |
        Returns 200 with result when source size < `web.async_analyze_threshold_bytes`;
        202 with jobId when async (M15.3).
      responses:
        '200':
          description: Synchronous analyze complete
        '202':
          description: Async job accepted (Location header)
  /api/v1/investigate:
    post:
      tags: [analysis]
      summary: Investigate with filter DSL
      responses:
        '200':
          description: Investigation result
  /api/v1/investigations:
    get:
      tags: [investigations]
      summary: List investigations
      description: Newest `updatedAt` first; bounded by `web.workspaces_list_limit`.
      responses:
        '200':
          description: Investigation metadata array
    post:
      tags: [investigations]
      summary: Create investigation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                captureSession:
                  type: boolean
      responses:
        '200':
          description: Investigation created
  /api/v1/investigations/{id}:
    get:
      tags: [investigations]
      summary: Get investigation metadata and artifact index
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata
        '404':
          description: Not found
    put:
      tags: [investigations]
      summary: Update investigation metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
    delete:
      tags: [investigations]
      summary: Delete investigation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /api/v1/investigations/{id}/artifacts:
    post:
      tags: [investigations]
      summary: Add artifact (log, note, pstack, or core)
      description: |
        `log` may omit `sourcePath` to use the session's active source.
        `pstack` and `core` require `sourcePath`. Optional `role` maps to `metadata.role`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [log, note, pstack, core]
                sourcePath:
                  type: string
                name:
                  type: string
                title:
                  type: string
                body:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Artifact added
  /api/v1/investigations/{id}/artifacts/{artifactId}:
    get:
      tags: [investigations]
      summary: Get artifact metadata or note body
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artifact payload
    delete:
      tags: [investigations]
      summary: Remove artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed
  /api/v1/investigations/{id}/artifacts/{artifactId}/crash-analysis:
    get:
      tags: [investigations]
      summary: Analyze crash artifact (pstack or core) and return CrashReport projection
      description: |
        Returns structured crash evidence for `pstack` or `core` artifacts.
        Report `status` is one of: `ready`, `unavailable`, `not_supported`, `failed`.
        `core` analysis is best-effort when GDB is available; returns `status=unavailable` with 200 when not.
        Log and note artifacts return 409 `NOT_SUPPORTED` with `not_supported` report in error details.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Crash report projection
        '404':
          description: Investigation or artifact not found
        '409':
          description: Artifact type not supported (`NOT_SUPPORTED`, `status=not_supported` in details)
  /api/v1/investigations/{id}/open:
    post:
      tags: [investigations]
      summary: Open a log artifact into caller session
      description: |
        Optional `artifactId` selects a log artifact (default entry).
        Snapshot restore applies only when opening the entry/default artifact.
        Non-log artifacts return 409 `ARTIFACT_NOT_OPENABLE`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                artifactId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Investigation loaded into session
        '409':
          description: Artifact not openable or invalid state
  /api/v1/investigations/{id}/timeline:
    get:
      tags: [investigations]
      summary: Project chronological timeline events from investigation artifacts
      description: |
        Returns merged timeline events (logs, notes, attached markers) in chronological order.
        Query `order=desc` for newest-first. Undated log lines are omitted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Timeline projection with events, pagination, and warnings
        '404':
          description: Investigation not found
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List shared workspaces (alias for investigations)
      responses:
        '200':
          description: Workspace metadata array
    post:
      tags: [workspaces]
      summary: Create shared workspace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                captureSession:
                  type: boolean
      responses:
        '200':
          description: Workspace created
  /api/v1/workspaces/{id}:
    get:
      tags: [workspaces]
      summary: Get workspace metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata
        '404':
          description: Not found
    put:
      tags: [workspaces]
      summary: Update workspace metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
    delete:
      tags: [workspaces]
      summary: Delete workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /api/v1/workspaces/{id}/open:
    post:
      tags: [workspaces]
      summary: Open workspace into caller session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace loaded into session
  /api/v1/tail/start:
    post:
      tags: [tail]
      summary: Start tail on open source
      responses:
        '200':
          description: Tail started
        '409':
          description: Already tailing
  /api/v1/tail/stop:
    post:
      tags: [tail]
      summary: Stop tail
      responses:
        '200':
          description: Tail stopped
  /api/v1/tail/poll:
    get:
      tags: [tail]
      summary: Poll new tail lines (non-blocking)
      responses:
        '200':
          description: New lines since last poll
        '409':
          description: Tail not active
  /api/v1/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Poll async analyze job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status (running | completed | failed)
        '404':
          description: Job not found or wrong session

components:
  schemas:
    CrashAnalysisStatus:
      type: string
      enum:
        - ready
        - unavailable
        - not_supported
        - failed
      description: |
        Outcome of crash analysis for an artifact.
        `ready` — analysis completed successfully;
        `unavailable` — required tool missing (e.g. GDB);
        `not_supported` — artifact type has no crash analyzer;
        `failed` — analyzer error or corrupt input.
