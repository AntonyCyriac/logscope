<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogScope Web</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>LogScope Web</h1>
    <p id="status">Initializing…</p>
  </header>

  <main>
    <section class="panel">
      <h2>Source</h2>
      <label class="file-label">
        <span>Upload log file</span>
        <input type="file" id="fileInput" accept=".log,.txt,.jsonl">
      </label>
      <button type="button" id="analyzeBtn" disabled>Analyze</button>
    </section>

    <section class="panel">
      <h2>Investigate</h2>
      <div class="row">
        <label>Search <input type="text" id="searchInput" placeholder="error"></label>
        <label>Filter DSL <input type="text" id="filterInput" placeholder="level == ERROR"></label>
      </div>
      <div class="row">
        <button type="button" id="investigateBtn" disabled>Investigate</button>
        <button type="button" id="exportBtn" disabled>Export HTML</button>
      </div>
    </section>

    <section class="panel">
      <h2>AI Ask</h2>
      <div class="row">
        <label>Ask <input type="text" id="askInput" placeholder="errors"></label>
        <button type="button" id="askBtn" disabled>Ask</button>
      </div>
    </section>

    <section class="panel">
      <h2>Results</h2>
      <pre id="summary">No data yet.</pre>
      <table id="resultsTable">
        <thead>
          <tr><th>Line</th><th>Level</th><th>Message</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Extensions</h2>
      <ul id="extensionsList"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
