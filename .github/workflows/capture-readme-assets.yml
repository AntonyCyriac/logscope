name: Capture README assets

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to commit updated PNGs to
        required: true
        default: chore/readme-v2.7.0-snapshot

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev qt6-base-dev

      - name: Build logscope-web, CLI, and desktop capture
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOGSCOPE_WEB=ON -DLOGSCOPE_DESKTOP=ON
          cmake --build build --target logscope-web logscope logscope-desktop logscope_capture_readme_desktop

      - name: Capture desktop screenshot
        run: |
          QT_QPA_PLATFORM=offscreen ./build/apps/desktop/tests/logscope_capture_readme_desktop

      - name: Setup Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright dependencies
        working-directory: tests/e2e/web
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture web and CLI screenshots
        env:
          LOGSCOPE_WEB_E2E_EXTERNAL: "1"
        run: |
          ./build/apps/web/logscope-web --config samples/demo-story-gate.properties &
          WEB_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          cd tests/e2e/web
          npx playwright test capture-readme-screenshots.spec.ts capture-readme-cli.spec.ts --project=chromium
          kill $WEB_PID || true

      - name: Commit and open PR with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/readme-assets-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add docs/assets/logscope-web.png docs/assets/logscope-cli.png docs/assets/logscope-desktop.png
          if git diff --staged --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "docs(assets): refresh README web, CLI, and desktop screenshots for v2.7.0"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "docs(assets): refresh README screenshots for v2.7.0" \
            --body "Automated capture from Capture README assets workflow (web Story 5, CLI, and desktop)."
