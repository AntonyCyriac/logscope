name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: logscope-linux-amd64
            binary_path: build/apps/cli/logscope
            platform: linux-amd64
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: logscope-windows-amd64
            binary_path: build/apps/cli/Release/logscope.exe
            platform: windows-amd64
            archive_ext: zip
          - os: macos-latest
            artifact_name: logscope-macos-amd64
            binary_path: build/apps/cli/logscope
            platform: macos-amd64
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CMAKE_TLS_VERIFY: '0'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Unix)
        if: matrix.os != 'windows-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --build-config Release --parallel

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" dist/
          cp -r samples dist/

      - name: Import macOS signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x scripts/macos_*.sh
          ./scripts/macos_import_certificate.sh

      - name: Sign and notarize macOS CLI binary
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/macos_sign_release.sh --binary dist/logscope
          ./scripts/macos_notarize_release.sh dist/logscope

      - name: Sign Windows release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign_windows_binaries.ps1 -Path dist

      - name: Create Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "logscope-${RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}" -C dist .

      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "logscope-${env:RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}"

      - name: CLI Matrix Smoke Test
        shell: bash
        env:
          BULK_LOG_LINES: 100000
        run: |
          python3 scripts/generate_bulk_log.py --lines "${BULK_LOG_LINES}" --format plain --output /tmp/bulk.log
          python3 scripts/generate_bulk_log.py --lines "${BULK_LOG_LINES}" --format jsonl --output /tmp/bulk.jsonl

          if [ "${{ runner.os }}" = "Windows" ]; then
            LOGSCOPE=./build/apps/cli/Release/logscope.exe
          else
            LOGSCOPE=./build/apps/cli/logscope
          fi

            python3 scripts/run_cli_matrix.py \
            --logscope "${LOGSCOPE}" \
            --plain-log /tmp/bulk.log \
            --jsonl-log /tmp/bulk.jsonl

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: logscope-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}

  build-desktop:
    name: Build Desktop (${{ matrix.artifact_name }})

    env:
      # GitHub macOS runners may have untrusted third-party taps; qt@6 is from homebrew-core.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: logscope-desktop-linux-amd64
            binary_path: build/apps/desktop/logscope-desktop
            platform: linux-amd64
            archive_ext: tar.gz
            qt_method: apt
          - os: windows-latest
            artifact_name: logscope-desktop-windows-amd64
            binary_path: build/apps/desktop/Release/logscope-desktop.exe
            platform: windows-amd64
            archive_ext: zip
            qt_method: install-qt-action
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_version: '6.8.*'
          - os: macos-latest
            artifact_name: logscope-desktop-macos-amd64
            binary_path: build/apps/desktop/logscope-desktop.app/Contents/MacOS/logscope-desktop
            platform: macos-amd64
            archive_ext: tar.gz
            qt_method: install-qt-action
            qt_host: mac
            qt_arch: clang_64
            # 6.8.4 is not published for mac via aqt; AGL stripped in apps/desktop/CMakeLists.txt
            qt_version: '6.8.*'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt6 (apt)
        if: matrix.qt_method == 'apt'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev

      - name: Install Qt6 (brew)
        if: matrix.qt_method == 'brew'
        run: brew install qt

      - name: Install Qt6 (install-qt-action)
        if: matrix.qt_method == 'install-qt-action'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLOGSCOPE_DESKTOP=ON

      - name: Configure CMake (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLOGSCOPE_DESKTOP=ON

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CMAKE_TLS_VERIFY: '0'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLOGSCOPE_DESKTOP=ON

      - name: Build Desktop
        run: cmake --build build --config Release --target logscope-desktop --parallel

      - name: Package Desktop Binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp build/apps/desktop/logscope-desktop dist/
          cp -r samples dist/
          tar -czf "logscope-desktop-${RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}" -C dist .

      - name: Import macOS signing certificate (desktop)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          chmod +x scripts/macos_*.sh
          ./scripts/macos_import_certificate.sh

      - name: Package Desktop Binary (macOS)
        if: matrix.os == 'macos-latest'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          CODESIGNIDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          mkdir -p dist
          cp -R build/apps/desktop/logscope-desktop.app dist/
          cp -r samples dist/
          DEPLOY_EXTRA=""
          if [[ -n "${CODESIGNIDENTITY:-}" ]]; then
            DEPLOY_EXTRA="-sign-for-notarization"
          fi
          macdeployqt dist/logscope-desktop.app -always-overwrite $DEPLOY_EXTRA

      - name: Sign and notarize macOS desktop app
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/macos_sign_release.sh --app dist/logscope-desktop.app \
            --entitlements apps/desktop/macos/entitlements.plist
          ./scripts/macos_notarize_release.sh dist/logscope-desktop.app

      - name: Archive macOS desktop release
        if: matrix.os == 'macos-latest'
        run: tar -czf "logscope-desktop-${RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}" -C dist .

      - name: Package Desktop Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binary = "${{ matrix.binary_path }}"
          $dir = Split-Path $binary -Parent
          windeployqt --release --no-translations "$binary"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path "$dir\*" -Destination dist -Recurse -Force
          Copy-Item -Path samples -Destination dist\samples -Recurse -Force

      - name: Sign Windows desktop binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign_windows_binaries.ps1 -Path dist

      - name: Package Desktop Binary (Windows archive)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "logscope-desktop-${env:RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: logscope-desktop-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}

  release:
    name: Publish GitHub Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release/${{ github.ref_name }}-RELEASE-NOTES.md
          files: release-assets/*
